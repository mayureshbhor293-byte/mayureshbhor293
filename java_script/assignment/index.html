<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>operation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1 align='center'> string Operation in JS</h1>
    <div class="container" align="center" >
        
        <input type="text" placeholder="Enter paragraph here" id="inputtext">
    </div>
    <div class="container rounded-5" style="background-color: aliceblue;padding-top: 30px ;padding-bottom: 30px;margin-top: 30px; margin-bottom: 30px;"id="result">
        result will be show here.........
    </div>
    <div class="container mt-4">
        <div class="row">
            <div class="col mb-3">
                <button class="btn btn-primary "onclick="vowels()">check Vowels</button>
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="Consonents()">check Consonents</button>
            </div>
            <div class="col">
                <button class="btn btn-primary"onclick="palindrom()">check palindrom</button>
            </div>
            <div class="col">
                <button class="btn btn-primary"onclick="Revstr()">reverse the string</button>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col">
                <button class="btn btn-primary" onclick="uppercase()">conver into upper case</button>
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="lowercase()">convert into lower case</button>
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="title()">title case </button>
            </div>
            <div class="col">
                <button class="btn btn-primary">extract the first words</button>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col">
                <button class="btn btn-primary" onclick="replace()">replace all spaces with (-)</button>
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="spaces()">count the spaces</button>
            </div>
            <div class="col">
                <button class="btn btn-primary"onclick="newlines()">count the new line</button>
            </div>
            <div class="col">
                <button class="btn btn-primary" onclick="firstword()">first word of string</button>
            </div>
        </div>
    </div>





















    <script src="script1.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
