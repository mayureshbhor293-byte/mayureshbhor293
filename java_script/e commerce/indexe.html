
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-Commerce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <h1 class="display-3 bg-info text-white p-4 text-center">
        E-Commerce
    </h1>

    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="./indexe.html">Batch98</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="./indexe.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>
                </ul>

                <a href="./cart.html" class="btn btn-outline-light">
                    Cart (<span id="cartLength">0</span>)
                </a>
            </div>
        </div>
    </nav>

    <div class="container w-75 w-md-50 mt-4 border p-4"
        style="background-image: linear-gradient(lightblue, deepskyblue);">

        <h3 class="text-center">Add Product</h3>

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="Name" placeholder="Name">
            <label for="Name">Product Name</label>
        </div>

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="Category" placeholder="Category">
            <label for="Category">Category</label>
        </div>

        <div class="form-floating mb-3">
            <input type="number" class="form-control" id="Price" placeholder="Price" min="0.01" step="0.01">
            <label for="Price">Price (₹)</label>
        </div>

        <div class="form-floating mb-3">
            <input type="number" class="form-control" id="Stock" placeholder="Stock" min="0" step="1">
            <label for="Stock">Stock</label>
        </div>

        <button class="btn btn-primary w-100" id="addNewBtn">
            Add New Product
        </button>
    </div>

    <div class="container mt-4">
        <div class="row g-3" id="productList"></div>
    </div>

    <script src="./jse.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
