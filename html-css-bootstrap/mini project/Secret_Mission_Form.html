<!Doctype html>
<html>

<head>
    <title> mini project 2 </title>
</head>

<body>
    <div>
        <h1 align="center"><u>Secret Mission Form</u></h1>
        <fieldset style="width:400px; margin:0 auto; text-align:left;">
            <legend align="center"> Registration Form</legend>
            <section>
                <label for="name">Agent name :</label>
                <input type="text" name="name" id=" Agent name" required placeholder="Enter Agent name">
                <br><br>

                <label for="type">Mission type :</label>
                <input type="text" name="type" id="Mission type" required>
                <br><br>

                <label for="Difficulty">Priority :</label>
                <input type="radio" name="Difficulty" id="low" required> low
                <input type="radio" name="Difficulty" id="medium" required> medium
                <input type="radio" name="Difficulty" id="high" required> high
                <input type="radio" name="Difficulty" id="Critical" required> Critical

                <br><br>

                <label for="address">Location :</label>
                <input type="text" name="address" id="location">

                <br><br>
                <legend>Equipment:</legend>
                <input type="checkbox" id="radio" name="equipment" value="Radio">
                <label for="radio">Radio</label><br>
                <input type="checkbox" id="map" name="equipment" value="Map">
                <label for="map">Map</label><br>
                <input type="checkbox" id="weapon" name="equipment" value="Weapon">
                <label for="weapon">Weapon</label><br>
                <input type="checkbox" id="disguise" name="equipment" value="Disguise">
                <label for="disguise">Disguise</label><br>
                <br>

        
        <label for="instructions">Mission Instructions:</label><br>
        <textarea id="instructions" name="instructions" rows="5" cols="40"></textarea><br><br>

        <section align="center">        
        <button type="submit">Accept Mission</button>
        </section>
        </form>

    </div>
</body>

</html>
