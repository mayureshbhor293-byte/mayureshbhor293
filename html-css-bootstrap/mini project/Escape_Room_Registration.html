<!Doctype html>
<html>

<head>
    <title> mini project 1 </title>
</head>

<body>
    <div>
        <h1 align="center"><u>Escape Room Registration</u></h1>
        <fieldset style="width:400px; margin:0 auto; text-align:left;">
            <legend align="center">Room Registration</legend>
        <section >
            <label for="name">Team name :</label>
            <input type="text" name="name" id="name" required placeholder="Enter name">
            <br><br>
        
            <label for="count">Player count :</label>
            <input type="number" name="player_count" id="count" required>
            <br><br>

            <label for="Difficulty">Difficulty :</label>
            <input type="radio" name="Difficulty" id="low" required> low
            <input type="radio" name="Difficulty" id="medium" required> medium
            <input type="radio" name="Difficulty" id="high" required> high

            <br><br>

            <label for="time">Preferred time :</label>
            <input type="time" name="time" id="time">

            <br><br>
            <label for="name">player name :</label>
            <input type="text" name="name" id="name">

            <br><br>
            <label for="rule">Rules :</label><br>
            <input type="checkbox" name="rule" id="rule1">Team size: 2–6 players<br>
            <input type="checkbox" name="rule" id="rule2">Arrive 15 minutes early<br>
            <input type="checkbox" name="rule" id="rule3">No phones or cameras inside<br>
            <input type="checkbox" name="rule" id="rule4">Respect props and staff<br>
            <input type="checkbox" name="rule" id="rule5">Follow game master’s instructions<br>
            <input type="checkbox" name="rule" id="rule6">No refunds for late arrivals or no‑shows<br>


            <br><br>
            <section align="center">
            <input type="submit" value="book" >
            </section>

        </section>
        </fieldset>

    </div>
</body>

</html>
