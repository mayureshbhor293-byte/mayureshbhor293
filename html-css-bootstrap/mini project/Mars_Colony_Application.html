<!DOCTYPE html>
<html>

<head>
    <title>mini project 3</title>
</head>

<body>
    <div>
        <h1 align="center">Mars Colony Application</h1>
        <fieldset style="width:400px; margin:0 auto; text-align:left">
            <legend align="center">Application form</legend>
            <section>
                <label for="name">Name : </label>
                <input type="text" placeholder="Enter name" required>
                <br><br>

                <label for="age">Age : </label>
                <input type="number" required>
                <br><br>

                <label for="email">E-mail : </label>
                <input type="email" placeholder="abc@gmail.com" required>
                <br><br>

                <label for="skill">skill : </label>
                <textarea id="skill" name="skill" rows="1" cols="40"></textarea><br><br>

                <label for="role">Colony role : </label>
                <input type="text" placeholder="role" required>
                <br><br>

                <label for="Experience">Experience : </label>
                <textarea id="Experience" name="Experience" rows="2" cols="40"></textarea><br><br>
                <label for="question">Why should you be selected? : </label>
                <textarea id="Why should you be selected?" name="queation" rows="5" cols="40"></textarea><br><br>


                <section align="center">
                    <button type="submit">Apply</button>
                </section>




            </section>
        </fieldset>
    </div>
</body>

</html>
