<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <h1 class="text-center m-3 bg-danger p-4">FORM</h1>
  <p class="text-center m-3 bg-secondary text-danger-emphasis border border-secondary p-2">Enter Personal details</p>
  <form action="" method="get">
    <fieldset style="width:400px; margin:0 auto; text-align:left">
      <div class="p-3 bg-info bg-opacity-10 border border-info border-start-0 rounded-end">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>




        <input type="password" id="password" name="password" required><br><br>

        <label for="year">Select Year:</label>
        <select name="year" id="year">
          <option value="first year">First Year</option>

          <option value="second year">Second Year</option>
          <option value="third year">Third Year</option>

          <option value="fourth year">Fourth Year</option>
        </select><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" id="male"><label for="male">Male</label>
        <input type="radio" name="gender" id="female"><label for="female">Female</label><br><br>
        <center>
          <button
            class="btn btn-outline-danger">Clear</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          <button class="btn btn-outline-success">Register</button>
        </center>









    </fieldset>
    </div>

  </form>



























  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
