<!DOCTYPE html>
<html>
    <head>
        <title>

        </title>
    </head>
    <body>
        <form>
            <fieldset>
            <h1 align="center">Student Registration </h1>
            <label for="name">Name : </label>
            <input type="text" name="" id=" name " required placeholder="Enter your name">
                <br><br>
            <label for="email">Email : </label>
            <input type="text" name="" id=" email " required >
                <br><br>
            <label for="name">Password : </label>
            <input type="password" name="" id="password " required >
            
            
            <br><br>
            <label for="gender">Gender : </label>
            <input type="radio" name="gender" id="male">Male

             <input type="radio" name="gender" id="Female">Female


            <br><br>
            <label for="hobbies">Hobbies : </label>

            <input type="checkbox" name=" hobbies" id="reading">Reading
            <input type="checkbox" name=" hobbies" id="music">Music
            <input type="checkbox" name=" hobbies" id="photography">Photography
            <input type="checkbox" name=" hobbies" id="Gaming ">Gaming 
            

        
            
            <br><br>
            <input type="button" value="submit">
        
        
        </fieldset>
        </form>









    </body>
</html>
