<!DOCTYPE html>
<html>

<head>
    <title>Registration</title>
</head>

<body style="text-align:center;">


    <fieldset style="width:400px; margin:0 auto; text-align:left;">

        <h1><u> Register</u></h1>

        <p><b>Kindly fill in this form to register.</b></p>

        <label><b>Username</b></label><br>
        <input type="text" placeholder="Enter username" style="width:100%;">
        <br><br>

        <label><b>Email</b></label><br>
        <input type="email" placeholder="Enter Email" style="width:100%;">
        <br><br>

        <label><b>Password</b></label><br>
        <input type="password" placeholder="Enter Password" style="width:100%;">
        <br><br>

        <label><b>Repeat Password</b></label><br>
        <input type="password" placeholder="Repeat Password" style="width:100%;">
        <br><br>

        <div style="text-align:center;">
            <input type="submit" value="Register" style="width:200px;">
        </div>
        <p>Already have an account? <a href="#">Log in</a></p>
    </fieldset>



</body>

</html>
