<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>School Championship Registration Form</title>
<link rel="stylesheet" href="form4.css">
</head>
<body>

<div class="form-container">
  <h1>School Championship Registration Form</h1>

  <label>School name:<span>*</span></label>
  <input type="text">

  <label>Schooler name:<span>*</span></label>
  <div class="row">
    <input type="text" placeholder="First">
    <input type="text" placeholder="Last">
  </div>

  <label>Parent name:<span>*</span></label>
  <div class="row">
    <input type="text" placeholder="First">
    <input type="text" placeholder="Last">
  </div>

  <label>Parent phone:<span>*</span></label>
  <input type="text" placeholder="### ### ####">

  <label>Parent email:<span>*</span></label>
  <input type="email">

  <label>Preferred sport:<span>*</span></label>
  <input type="text">

  <label class="center">Verification<span>*</span></label>
  <div class="captcha">
    <input type="checkbox">
    <span>I'm not a robot</span>
    <img class="img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbaar583mtf2qFgQTapT4A_LPfT15yfnw_ZzflVcOqcw&s=10 " width="40px" height="40px ">
  </div>

  <button type="submit">&#9658; Submit</button>
</div>

</body>
</html>
