<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in</title>
  <link rel="stylesheet" href="form2.css" />
</head>
<body>

  <div class="card">

    <div class="left-panel">
      <div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/250px-Instagram_logo_2016.svg.png?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" style="width: 100px; height:100px;">
        
      </div>

      <h1 class="tagline">
        See everyday moments from
        <span class="highlight">your close friends.</span>
      </h1>

      <div class="phones">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSl7DO3O6KCkkODoHKBUjpXhLzLtgSB0god542e02BVcw&s=10"
        style="width: 250px; height:250px; border-radius: 50%;">
        
      </div>
    </div>

    <div class="right-panel">
      <h2 class="login-title">Log into Instagram</h2>

      <form action="#" method="post">
        <input type="text" name="username" placeholder="Mobile number, username or email">
        <input type="password" name="password" placeholder="Password">
        <button type="submit" class="btn-primary" >Log in</button>
      </form>

      <a href="#" class="forgot-link">Forgot password?</a>

      <button class="btn-facebook">Log in with Facebook</button>

      <a href="form2log.html" class="btn-create" >Create new account</a>
    </div>

  </div>

</body>
</html>
